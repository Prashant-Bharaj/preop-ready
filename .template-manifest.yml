# =============================================================================
# Template Manifest - Vibe Hackathon Platform
# =============================================================================
# This file defines which files are synced to child repos.
# Child repos use template-sync.yml to pull updates from template.
#
# ARCHITECTURE (Pull-based, scales to 50k+ repos):
#   1. Template repo bumps version when platform files change
#   2. Child repos have template-sync.yml workflow
#   3. Child repos check manifest version and sync if outdated
# =============================================================================

version: "2.0.6"
template_repo: "bayer-int/dd-template-repository"
template_branch: "master"

# -----------------------------------------------------------------------------
# Files to auto-update (platform files, not user code)
# These are safe to overwrite - users shouldn't modify them.
#
# TWO SECTIONS, and the split is load-bearing (see apply-updates.sh § 3b):
#   auto_update:        ADDITIVE — reaches every child on every release, whatever
#                       template major it is on: Dockerfile/nginx templates,
#                       security scripts, workflows, the engine itself.
#   auto_update_major:  BREAKING — the AI rules, snippets, generated adapters
#                       and the harness. Applied only when the child is already
#                       on the current major or opts in (`--accept-major`).
# Pre-engine children copy `auto_update:` themselves and stop at the next
# top-level key, so they can never see the gated section — do NOT move an
# entry down there by adding a flag; move the entry.
# -----------------------------------------------------------------------------
auto_update:
  # Workflows - CRITICAL: includes the sync workflow itself
  - path: ".github/workflows/deploy.yml"
    description: "Deployment workflow"
  - path: ".github/workflows/template-sync.yml"
    description: "Template sync workflow (enables pull-based updates)"
  - path: ".github/workflows/dependabot-auto-merge.yml"
    description: "Auto-merge patch/minor Dependabot PRs after CI passes"
  - path: ".github/dependabot.yml"
    description: "Dependabot cadence: weekly grouped updates with cooldown (no per-push PR bursts)"
    
  # Frontend Dockerfile templates
  - path: "frontend/Dockerfile.react"
    description: "React/Vite Dockerfile template (secure, non-root)"

  # Docker build-context exclusions — Docker does NOT read .gitignore, so
  # without these a local .env is baked into the image. One per build context;
  # the root one is inert.
  - path: "frontend/.dockerignore"
    description: "Keeps .env and friends out of the frontend image (build context = ./frontend)"
  - path: "backend/.dockerignore"
    description: "Keeps .env and friends out of the backend image (build context = ./backend)"
  - path: ".dockerignore"
    description: "Root build-context exclusions (safety net for ad-hoc root builds only)"


  # Nginx configuration templates (with security headers)
  - path: "frontend/nginx.conf"
    description: "Production nginx config template (security headers included)"
    note: "Users should copy this when setting up frontend"
  - path: "frontend/nginx.local.conf"
    description: "Local dev nginx config template (with API proxy)"

  # Backend Dockerfile templates
  - path: "backend/Dockerfile.node"
    description: "Node.js backend Dockerfile template (secure, non-root)"
  - path: "backend/Dockerfile.python"
    description: "Python backend Dockerfile template (secure, non-root)"
  - path: "backend/Dockerfile.rust"
    description: "Rust backend Dockerfile template (secure, multi-stage, non-root)"
    
  # Database Dockerfile templates
  - path: "database/Dockerfile.postgres"
    description: "PostgreSQL database template"
  # Vector Database Dockerfile templates
  - path: "vectordb/Dockerfile.pgvector"
    description: "pgvector vector database template"

  # Migration escape hatch — shipped ADDITIVELY so projects held on an old
  # major (retired stack) receive the skill that gets them off it. The parent
  # directories stay gated; these explicit entries sync just these files.
  - path: ".platform-rules/scope-migration.md"
    description: "Canonical migration rule: retired stack → supported stack, then accept the major"
  - path: ".claude/skills/migration/"
    description: "Generated: Claude Code skill for the migration rule"
    is_directory: true

  # Security — AI ignore files and pre-commit hook
  - path: ".clineignore"
    description: "Cline AI ignore file (blocks sensitive files from auto-context)"
  - path: ".cursorignore"
    description: "Cursor AI ignore file (blocks sensitive files from reading)"
  - path: ".copilotignore"
    description: "GitHub Copilot ignore file (blocks sensitive files from context)"
  - path: "scripts/pre-commit-security-check.sh"
    description: "Pre-commit hook: blocks sensitive files and secrets from commits"
  - path: "scripts/install-hooks.sh"
    description: "Installs pre-commit security hook (runs on Codespace start)"

  # Database seed directory
  - path: "database/seed/.gitkeep"
    description: "Gitignored directory for local test/seed data"

  # AI context folder (for giving files to AI)
  - path: "context/.gitkeep"
    description: "Folder for files to share with AI assistant"
    
  # Development environment
  - path: ".devcontainer/devcontainer.json"
    description: "Codespaces/devcontainer configuration"
  - path: ".devcontainer/setup-claude-router.sh"
    description: "Installs Claude Code + claude-code-router, connects to myGenAssist"
  - path: ".devcontainer/mga-login.sh"
    description: "Interactive myGenAssist key prompt for Claude Code"
  - path: ".devcontainer/auto-update-template.sh"
    description: "Auto-check and apply template updates on Codespace start"
    
  # Documentation
  - path: "docs/CODESPACE_CLAUDE_CODE_SETUP.md"
    description: "How Claude Code connects to myGenAssist in a Codespace"

  # Scripts
  - path: "scripts/sync-from-template.sh"
    description: "Manual sync script (alternative to workflow)"
  - path: "scripts/apply-updates.sh"
    description: "AI-driven update script (machine-readable output)"
  - path: "scripts/check-updates.sh"
    description: "AI-driven version check script (machine-readable output)"
  - path: "scripts/preflight-check.sh"
    description: "Pre-deployment validation checks"
  - path: "scripts/check-dependabot-prs.sh"
    description: "Codespace-start Dependabot handler: auto-merge green patch/minor, surface majors"
  - path: "scripts/check-template-pr.sh"
    description: "Session-start platform status for AI tools: open sync PR, sync-workflow state, version"
  - path: "scripts/detect-stack.sh"
    description: "Stack detection (backend/frontend/db/vectordb + retired layers) for the major gate and the migration skill"
  - path: "scripts/pre-push-review.sh"
    description: "Pre-push audit attestation gate"
  - path: "scripts/audit/"
    description: "Deep-audit playbook, reviewer prompt, Stop hook, per-dev Claude hook installer"
    is_directory: true

# -----------------------------------------------------------------------------
# Files applied only on the current MAJOR (or with --accept-major)
# The AI rules, snippets, generated adapters and the harness: a major release
# replaces how the assistant builds, which must not land under a project in
# flight. Engine: apply-updates.sh § 3b. Same entry format as auto_update.
# -----------------------------------------------------------------------------
auto_update_major:
  # AI rules — canonical source + generated per-tool adapters
  # (.platform-rules/ is the ONLY hand-edited rules location; the rest is
  #  produced by scripts/build-rule-adapters.js in the template repo)
  - path: ".platform-rules/"
    description: "Canonical platform rules (core + scopes + reference)"
    is_directory: true
  - path: ".claude/skills/"
    description: "Generated: Claude Code skills (on-demand rule picking)"
    is_directory: true
  - path: ".cursor/rules/"
    description: "Generated: Cursor rules (always-on core + glob-attached scopes)"
    is_directory: true
  - path: ".github/instructions/"
    description: "Generated: Copilot path-scoped instructions"
    is_directory: true
  - path: ".github/copilot-instructions.md"
    description: "Generated: Copilot always-on core mirror"
  - path: ".clinerules/"
    description: "Generated: Cline core mirror + router"
    is_directory: true
  - path: ".cursorrules"
    description: "Deprecation stub (rules moved to .platform-rules/ + .cursor/rules/)"
  - path: "CLAUDE.md"
    description: "AI assistant instructions (Claude Code) — imports .platform-rules core"

  # Code Snippet Library (TypeScript-canonical since 2.0)
  - path: "snippets/"
    description: "Reusable code snippets"
    is_directory: true

  # Examples
  - path: "examples/"
    description: "Example config files (eslint, ruff, vite)"
    is_directory: true

  # README + docs written for the 2.0 flow
  - path: "README.md"
    description: "Project README with data security warning and getting started guide"
  - path: "docs/MIGRATION.md"
    description: "Migration guide for existing projects"
  - path: "docs/EXAMPLES.md"
    description: "Example prompts for describing app ideas"

  # The AI build harness (chat UI + build pipeline). Users do not edit it;
  # git-ignored content inside it (node_modules, bench results) is preserved.
  - path: "chat/"
    description: "AI build harness: chat UI, planner, build pipeline, bench"
    is_directory: true
  - path: ".chat/README.md"
    description: "Harness runtime folder: how to connect (secrets.json is gitignored)"
  - path: ".chat/secrets.example.json"
    description: "Harness credentials example (copy to .chat/secrets.json)"

# -----------------------------------------------------------------------------
# Files to merge intelligently
# AI will preserve user additions while updating structure
# -----------------------------------------------------------------------------
merge_update:
  - path: "docker-compose.yml"
    description: "Local development configuration"
    strategy: "preserve_user_services"
    
  - path: ".gitignore"
    description: "Git ignore patterns"
    strategy: "append_missing"

# -----------------------------------------------------------------------------
# Files to check but not auto-update
# AI will warn if these are outdated but won't change them
# -----------------------------------------------------------------------------
check_only:
  - path: "frontend/nginx.conf"
    description: "User's nginx configuration"
    check_for:
      - "/health endpoint exists"
      - "No events{} or http{} blocks"
      - "Security headers present (server_tokens off, X-Frame-Options, X-Content-Type-Options, X-XSS-Protection)"
      
  - path: "frontend/Dockerfile"
    description: "User's frontend Dockerfile"
    check_for:
      - "nginx.conf copied to conf.d/default.conf"
      - "Non-root user (USER appuser or similar)"
      
  - path: "backend/Dockerfile"
    description: "User's backend Dockerfile"
    check_for:
      - "Non-root user (USER appuser or similar)"

# -----------------------------------------------------------------------------
# Files to never touch (user code and status)
# -----------------------------------------------------------------------------
ignore:
  - "frontend/src/**"
  - "frontend/index.html"
  - "frontend/style.css"
  - "frontend/script.js"
  - "frontend/package.json"
  - "frontend/Dockerfile"       # User's chosen frontend Dockerfile
  - "backend/server.js"
  - "backend/main.py"
  - "backend/requirements.txt"
  - "backend/package.json"
  - "backend/Cargo.toml"
  - "backend/Cargo.lock"
  - "backend/Dockerfile"        # User's chosen backend Dockerfile
  - "backend/src/**"            # User's backend source code
  - "backend/middleware/**"     # User's middleware (may include identity etc)
  - "database/Dockerfile"       # User's chosen database Dockerfile
  - "database/init/**"          # User's database init scripts
  - "vectordb/Dockerfile"       # User's chosen vector database Dockerfile
  - "vectordb/init/**"          # User's vector database init scripts
  - "docs/PROJECT_STATUS.md"    # User's project status - never overwrite!
  - "context/**"                # User's AI analysis files (gitignored anyway)
  - ".env"
  - "*.log"

# -----------------------------------------------------------------------------
# Files/directories to remove from child repos during sync
# These were previously part of the template but have been deprecated
# -----------------------------------------------------------------------------
cleanup:
  - path: ".devcontainer/install-cline.sh"
    type: "file"
    reason: "Replaced by setup-claude-router.sh (Cline → Claude Code)"
  - path: "backend/env.example"
    type: "file"
    reason: "Removed — flagged by cybersecurity (credentials in repo)"
  - path: "database/env.example"
    type: "file"
    reason: "Removed — flagged by cybersecurity (credentials in repo)"
  - path: "database/.env.example"
    type: "file"
    reason: "Removed — flagged by cybersecurity (credentials in repo)"
  - path: "vectordb/env.example"
    type: "file"
    reason: "Removed — flagged by cybersecurity (credentials in repo)"

# -----------------------------------------------------------------------------
# Migrations - one-time steps applied when a child crosses a version boundary
#
# Unlike cleanup (permanent "must never exist" invariants, re-checked on every
# sync), a migration block runs once: the engine applies every block with a
# version greater than the child's local version, in ascending order, BEFORE
# syncing files. Children jumping multiple versions replay each block in order.
#
# FORMAT IS RIGID (parsed by bash in apply-updates.sh) - keep exactly:
#   2-space indent for the quoted version key, 6-space indent for steps,
#   double-quoted single-line values.
#
# Supported steps (all idempotent):
#   - delete: "path/to/file"                    # remove a file if present
#   - delete_dir: "path/to/dir"                 # remove a directory if present
#   - move: "old/path -> new/path"              # move if source exists, target doesn't
#   - gitignore_add: "pattern"                  # ensure .gitignore line exists
#   - gitignore_remove: "pattern"               # drop exact .gitignore line
#   - run: "scripts/migrations/<ver>-name.sh"   # script executed FROM THE TEMPLATE
#                                               # REF (must itself be idempotent)
# Example:
#   "1.5.0":
#     description: "Rules reorg: retire .cursorrules"
#     steps:
#       - delete: ".cursorrules"
# -----------------------------------------------------------------------------
migrations:
  # NOTE: the version key MUST equal the release version of the change it
  # belongs to — adjust before merging if the numbering has moved on.
  # A block whose major is above the child's is deferred while that major is
  # held (apply-updates.sh § 3b) and replays on --accept-major.
  "2.0.0":
    description: "TypeScript-canonical template + AI build harness; retired vanilla/MySQL/Chroma/Qdrant"
    steps:
      # Engine backups (.template-backup/) must never be committed; the engine
      # adds this lazily, the migration makes it explicit for every 2.0 child.
      - gitignore_add: ".template-backup/"
      # Harness bench output is local scratch.
      - gitignore_add: "chat/bench/results/"
  "1.4.0":
    description: "Sync engine + rules restructure (.platform-rules/ canonical tree, generated adapters)"
    steps:
      # Old blanket ignore blocked .claude/skills/ from ever being committed;
      # the template .gitignore now ships `.claude/*` + `!.claude/skills/`
      # (re-added automatically by the gitignore merge after this runs).
      - gitignore_remove: ".claude/"


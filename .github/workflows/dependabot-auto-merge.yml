# =============================================================================
# Dependabot Auto-Merge Workflow
# =============================================================================
# Automatically approves and merges Dependabot PRs for patch and minor updates.
# Major version bumps are left for manual review.
#
# How it works:
#   1. Dependabot opens a PR
#   2. This workflow checks the update type (patch/minor/major)
#   3. Patch & minor: auto-approve + enable auto-merge (squash)
#   4. Major: skip — requires manual review
#   5. Auto-merge waits for CI (CodeQL) to pass before completing
# =============================================================================

name: Dependabot Auto-Merge

on:
  pull_request:

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve patch and minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log skipped major update
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "⚠️ Major version bump detected: ${{ steps.metadata.outputs.dependency-names }}"
          echo "   ${{ steps.metadata.outputs.previous-version }} → ${{ steps.metadata.outputs.new-version }}"
          echo "   Skipping auto-merge — manual review required."

# =============================================================================
# Dependabot Auto-Merge Workflow
# =============================================================================
# Automatically approves and merges Dependabot PRs for patch and minor updates,
# but ONLY after verifying the dependencies actually install and build.
#
# How it works:
#   1. Dependabot opens a PR
#   2. `metadata` reads the update type (patch/minor/major) — no code checked out
#   3. Major: skip — requires manual review
#   4. Patch & minor: `verify` checks out the PR and installs/builds it
#   5. `merge` auto-approves + enables auto-merge (squash) if verify passed
#   6. If verify failed: post a comment, do NOT approve
#   7. Auto-merge waits for CI (CodeQL) to pass before completing
#
# ⚠️  SECURITY — WHY THIS IS THREE JOBS
# Installing and building a proposed dependency tree EXECUTES third-party code
# on the runner. That must never happen in a job that can write to the repo.
#   - `verify` runs the untrusted code: contents: read only, no other scopes,
#     and persist-credentials: false so no token is left in .git/config for it
#     to steal.
#   - `merge` holds the write scopes but checks out NOTHING and runs only gh
#     commands.
# `npm ci --ignore-scripts` blocks install-time lifecycle hooks (preinstall /
# postinstall), but it is only PARTIAL protection: `npm run build` still loads
# and executes the dependency's own code by design. The permission split above
# is the real control — treat --ignore-scripts as defence in depth, not the fix.
# =============================================================================

name: Dependabot Auto-Merge

on:
  pull_request:

# No workflow-level grant: every job declares the minimum it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Metadata — reads the PR only, checks out no code
  # ---------------------------------------------------------------------------
  metadata:
    name: Read Dependabot metadata
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: read
    outputs:
      update-type: ${{ steps.metadata.outputs.update-type }}
      dependency-names: ${{ steps.metadata.outputs.dependency-names }}
      previous-version: ${{ steps.metadata.outputs.previous-version }}
      new-version: ${{ steps.metadata.outputs.new-version }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log skipped major update
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "⚠️ Major version bump detected: ${{ steps.metadata.outputs.dependency-names }}"
          echo "   ${{ steps.metadata.outputs.previous-version }} → ${{ steps.metadata.outputs.new-version }}"
          echo "   Skipping auto-merge — manual review required."

  # ---------------------------------------------------------------------------
  # 2. Verify — THIS JOB EXECUTES UNTRUSTED DEPENDENCY CODE
  #    contents: read, nothing else. No credentials persisted. No write scopes
  #    anywhere in this job, so a malicious package cannot push, approve,
  #    merge, or read secrets.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify dependencies install and build
    needs: metadata
    if: needs.metadata.outputs.update-type != 'version-update:semver-major'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      install_ok: ${{ steps.verify.outputs.install_ok }}
    steps:
      - name: Checkout PR code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Do not leave the token in .git/config for the dependency code to find
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify dependencies install and build
        id: verify
        run: |
          FAILED=false

          # Check all directories with package-lock.json (npm projects)
          for lockfile in $(find . -name "package-lock.json" -not -path "*/node_modules/*" 2>/dev/null); do
            DIR=$(dirname "$lockfile")
            echo "📦 Testing npm ci in $DIR..."
            # `npm ci` (not install): installs exactly the lockfile Dependabot
            # proposed. --ignore-scripts blocks preinstall/postinstall hooks —
            # partial only, see the header: the build below still runs
            # dependency code.
            if (cd "$DIR" && npm ci --ignore-scripts 2>&1); then
              echo "   ✅ $DIR — install succeeded"
              # Run build to catch breaking changes (e.g., Vite 5→8 API incompatibility)
              # This is the real gate — install alone doesn't catch major version breaks
              if [ -f "$DIR/package.json" ] && grep -q '"build"' "$DIR/package.json"; then
                echo "   🔨 Testing npm run build in $DIR..."
                if (cd "$DIR" && npm run build 2>&1); then
                  echo "   ✅ $DIR — build succeeded"
                else
                  echo "   ❌ $DIR — build FAILED (likely a breaking change)"
                  FAILED=true
                fi
              fi
            else
              echo "   ❌ $DIR — install FAILED"
              FAILED=true
            fi
          done

          # Check all directories with requirements.txt (Python projects)
          for reqfile in $(find . -name "requirements.txt" -not -path "*/node_modules/*" 2>/dev/null); do
            DIR=$(dirname "$reqfile")
            echo "🐍 Testing pip install in $DIR..."
            if (cd "$DIR" && pip install -r requirements.txt --dry-run 2>&1); then
              echo "   ✅ $DIR — install succeeded"
            else
              echo "   ❌ $DIR — install FAILED"
              FAILED=true
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "install_ok=false" >> $GITHUB_OUTPUT
          else
            echo "install_ok=true" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # 3. Merge — holds the write scopes, checks out NO code, runs only gh
  # ---------------------------------------------------------------------------
  merge:
    name: Approve and auto-merge
    needs: [metadata, verify]
    if: needs.metadata.outputs.update-type != 'version-update:semver-major'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Comment on failed install
        if: needs.verify.outputs.install_ok == 'false'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body "## ❌ Auto-merge blocked

          The dependency update from **${{ needs.metadata.outputs.dependency-names }}** (${{ needs.metadata.outputs.previous-version }} → ${{ needs.metadata.outputs.new-version }}) failed the install verification.

          \`npm ci\` or \`pip install\` failed with errors. This PR will **not** be auto-merged.

          **Next steps:**
          - Check the workflow logs for the specific error
          - Fix the dependency conflict manually, or close this PR

          🤖 _Dependabot Auto-Merge_"

      - name: Auto-approve patch and minor updates
        if: needs.verify.outputs.install_ok == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: needs.verify.outputs.install_ok == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

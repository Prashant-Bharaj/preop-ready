# =============================================================================
# Vibe Coded Project Deployment Workflow
# =============================================================================
# This workflow deploys your vibe coded project to AWS ECS.
#
# - Full-stack apps (with backend) → AWS ECS
# - (DevOps Docs / static deployment is commented out below)
#
# Triggers:
#   - After CodeQL security scan completes on main/master (automatic)
#   - Manual dispatch (for testing)
#
# Security: Deployment only proceeds if CodeQL passes!
#
# URL: https://<repo-name>.vibe.992872368362.cloud.bayer.com
# =============================================================================

name: Deploy Vibe Project

on:
  # Trigger after CodeQL completes - ensures security scan passes before deploy
  workflow_run:
    workflows: ["CodeQL"]
    branches: [main, master]
    types: [completed]
  # Manual trigger for testing (bypasses security check)
  workflow_dispatch:

# Required permissions
permissions:
  id-token: write
  contents: read

jobs:
  # ===========================================================================
  # Gate: Check if deployment should proceed
  # ===========================================================================
  # This job always runs to prevent "No jobs were run" notifications
  gate:
    name: 🚦 Check Deployment Conditions
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      - name: Check deployment conditions
        id: check
        run: |
          REPO="${{ github.repository }}"
          EVENT="${{ github.event_name }}"
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          
          echo "Repository: $REPO"
          echo "Event: $EVENT"
          echo "CodeQL conclusion: $CONCLUSION"
          
          # Skip template repos
          if [[ "$REPO" == "bayer-int/dd-template-repository" ]] || [[ "$REPO" == "bayer-int/dd-template-repo" ]]; then
            echo "⏭️ Skipping: This is the template repository"
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # For workflow_run trigger, check CodeQL passed
          if [[ "$EVENT" == "workflow_run" ]] && [[ "$CONCLUSION" != "success" ]]; then
            echo "⏭️ Skipping: CodeQL did not succeed (conclusion: $CONCLUSION)"
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "✅ All conditions met - proceeding with deployment"
          echo "should-deploy=true" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Detect Project Stack
  # ===========================================================================
  detect:
    name: 🔍 Detect Stack
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should-deploy == 'true'
    outputs:
      deployment-type: ${{ steps.detect.outputs.deployment-type }}
      frontend-type: ${{ steps.detect.outputs.frontend-type }}
      has-backend: ${{ steps.detect.outputs.has-backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project stack
        id: detect
        run: |
          echo "🔍 Detecting project stack..."
          echo ""
          
          # Check for backend
          HAS_BACKEND="false"
          if [[ -f "backend/Dockerfile" ]] && grep -qE "^FROM " "backend/Dockerfile" 2>/dev/null; then
            HAS_BACKEND="true"
            echo "✅ Backend detected (backend/Dockerfile with valid FROM)"
          else
            echo "❌ No backend detected"
          fi
          
          # Check for frontend and its type
          FRONTEND_TYPE="none"
          if [[ -d "frontend" ]]; then
            if [[ -f "frontend/package.json" ]]; then
              FRONTEND_TYPE="react"
              echo "✅ React/SPA frontend detected (has package.json)"
            elif [[ -f "frontend/index.html" ]]; then
              FRONTEND_TYPE="vanilla"
              echo "✅ Vanilla frontend detected (HTML/CSS/JS)"
            fi
          fi
          
          # Determine deployment type (only AWS ECS is enabled; static/DevOps Docs is commented out)
          if [[ "$HAS_BACKEND" == "true" ]]; then
            DEPLOYMENT_TYPE="ecs"
            echo ""
            echo "📦 Deployment: ECS (has backend)"
          elif [[ "$FRONTEND_TYPE" != "none" ]]; then
            echo ""
            echo "❌ ERROR: Only AWS ECS deployment is enabled."
            echo "   Add a backend (backend/Dockerfile) to deploy."
            echo "   (Static/DevOps Docs deployment is currently disabled in this workflow.)"
            exit 1
          else
            echo ""
            echo "❌ ERROR: No deployable content found!"
            echo "   Need backend/Dockerfile for ECS deployment."
            exit 1
          fi
          
          echo ""
          echo "=============================================="
          echo "📋 Detection Results:"
          echo "   deployment-type=$DEPLOYMENT_TYPE"
          echo "   frontend-type=$FRONTEND_TYPE"
          echo "   has-backend=$HAS_BACKEND"
          echo "=============================================="
          
          echo "deployment-type=$DEPLOYMENT_TYPE" >> $GITHUB_OUTPUT
          echo "frontend-type=$FRONTEND_TYPE" >> $GITHUB_OUTPUT
          echo "has-backend=$HAS_BACKEND" >> $GITHUB_OUTPUT


# =============================================================================
# Vibe Coded Project Deployment Workflow
# =============================================================================
# - Frontend-only (no backend) → DevOps Docs (official publish-docs) — saves AWS cost
# - Full-stack (has backend)   → AWS ECS
#
# Triggers:
#   - After CodeQL security scan completes on main/master (deploy only if CodeQL passed)
#   - Manual dispatch (for testing)
#
# URLs:
#   - Static: https://docs.int.bayer.com/-/<repo-name>/
#   - ECS:    https://<repo-name>.vibe.992872368362.cloud.bayer.com
# =============================================================================

name: Deploy Vibe Project

on:
  workflow_run:
    workflows: ["CodeQL"]
    branches: [main, master]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate: only proceed when CodeQL passed (or manual) and not template repo
  # ---------------------------------------------------------------------------
  gate:
    name: Check deployment conditions
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      - name: Check conditions
        id: check
        run: |
          REPO="${{ github.repository }}"
          EVENT="${{ github.event_name }}"
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          if [[ "$REPO" == "bayer-int/dd-template-repository" ]] || [[ "$REPO" == "bayer-int/dd-template-repo" ]]; then
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [[ "$EVENT" == "workflow_run" ]] && [[ "$CONCLUSION" != "success" ]]; then
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "should-deploy=true" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # Detect: frontend-only (static) vs full-stack (ECS)
  # ---------------------------------------------------------------------------
  detect:
    name: Detect stack
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should-deploy == 'true'
    outputs:
      deployment-type: ${{ steps.detect.outputs.deployment-type }}
      frontend-type: ${{ steps.detect.outputs.frontend-type }}
      has-backend: ${{ steps.detect.outputs.has-backend }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect project stack
        id: detect
        run: |
          HAS_BACKEND="false"
          if [[ -f "backend/Dockerfile" ]] && grep -qE "^FROM " "backend/Dockerfile" 2>/dev/null; then
            HAS_BACKEND="true"
          fi
          FRONTEND_TYPE="none"
          if [[ -d "frontend" ]]; then
            if [[ -f "frontend/package.json" ]]; then
              FRONTEND_TYPE="react"
            elif [[ -f "frontend/index.html" ]]; then
              FRONTEND_TYPE="vanilla"
            fi
          fi
          if [[ "$HAS_BACKEND" == "true" ]]; then
            echo "deployment-type=ecs" >> $GITHUB_OUTPUT
          elif [[ "$FRONTEND_TYPE" != "none" ]]; then
            echo "deployment-type=static" >> $GITHUB_OUTPUT
          else
            echo "::error::No deployable content (need frontend/ or backend/Dockerfile)"
            exit 1
          fi
          echo "frontend-type=$FRONTEND_TYPE" >> $GITHUB_OUTPUT
          echo "has-backend=$HAS_BACKEND" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # Build static site (artifact name "site" for publish-docs)
  # ---------------------------------------------------------------------------
  build-static:
    name: Build site
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.deployment-type == 'static'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site (vanilla)
        if: needs.detect.outputs.frontend-type == 'vanilla'
        run: |
          mkdir -p site
          cp -r frontend/* site/
      - name: Setup Node.js
        if: needs.detect.outputs.frontend-type == 'react'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build React and prepare site
        if: needs.detect.outputs.frontend-type == 'react'
        run: |
          mkdir -p site
          cd frontend
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          cp -r dist/* ../site/
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

  # ---------------------------------------------------------------------------
  # Deploy to DevOps Docs (bayer-int/actions-workflows publish-docs.yml)
  # Contract: artifact downloaded to ./<artifact>; dir = local folder for s3 sync.
  # No repo secrets needed; publish-docs uses its own OIDC (docs.int.bayer.com).
  # ---------------------------------------------------------------------------
  deploy-static:
    name: Publish to DevOps Docs
    runs-on: ubuntu-latest
    needs: [detect, build-static]
    if: |
      always() &&
      needs.detect.outputs.deployment-type == 'static' &&
      (needs.build-static.result == 'success' || needs.build-static.result == 'skipped')
    permissions:
      contents: write
      deployments: write
      id-token: write
      pull-requests: write
    uses: bayer-int/actions-workflows/.github/workflows/publish-docs.yml@main
    with:
      artifact: site
      dir: site
      preview: ${{ github.ref != 'refs/heads/main' && github.run_id || '' }}
      spa: ${{ needs.detect.outputs.frontend-type == 'react' }}

  # ---------------------------------------------------------------------------
  # Deploy to ECS (full-stack)
  # ---------------------------------------------------------------------------
  deploy-ecs:
    name: Deploy to ECS
    needs: detect
    if: needs.detect.outputs.deployment-type == 'ecs'
    uses: bayer-int/dd-platform-repository/.github/workflows/deploy-demo.yml@master
    with:
      project-name: ${{ github.event.repository.name }}
    secrets:
      AWS_DEPLOY_ROLE_ARN: "arn:aws:iam::992872368362:role/vibe-platform-github-deploy"
      APP_OPENAI_KEY: ${{ secrets.APP_OPENAI_KEY }}
      APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
      APP_API_KEY: ${{ secrets.APP_API_KEY }}
      APP_API_SECRET: ${{ secrets.APP_API_SECRET }}
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
      APP_WEBHOOK_SECRET: ${{ secrets.APP_WEBHOOK_SECRET }}
      APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
      APP_SECRET_1: ${{ secrets.APP_SECRET_1 }}
      APP_SECRET_2: ${{ secrets.APP_SECRET_2 }}
      APP_SECRET_3: ${{ secrets.APP_SECRET_3 }}

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  summary:
    name: Deployment summary
    runs-on: ubuntu-latest
    needs: [gate, detect, deploy-static, deploy-ecs]
    if: always() && needs.gate.outputs.should-deploy == 'true' && needs.detect.result == 'success'
    steps:
      - name: Summary
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          DEPLOY_TYPE: ${{ needs.detect.outputs.deployment-type }}
          STATIC_RESULT: ${{ needs.deploy-static.result }}
          ECS_RESULT: ${{ needs.deploy-ecs.result }}
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "$DEPLOY_TYPE" == "static" ]]; then
            echo "**Type:** Frontend-only (DevOps Docs)" >> $GITHUB_STEP_SUMMARY
            echo "**URL:** https://docs.int.bayer.com/-/${REPO_NAME}/" >> $GITHUB_STEP_SUMMARY
            [[ "$STATIC_RESULT" == "success" ]] && echo "**Status:** Success" >> $GITHUB_STEP_SUMMARY || echo "**Status:** $STATIC_RESULT" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Type:** Full-stack (AWS ECS)" >> $GITHUB_STEP_SUMMARY
            echo "**URL:** https://${REPO_NAME}.vibe.992872368362.cloud.bayer.com" >> $GITHUB_STEP_SUMMARY
            [[ "$ECS_RESULT" == "success" ]] && echo "**Status:** Success" >> $GITHUB_STEP_SUMMARY || echo "**Status:** $ECS_RESULT" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Accessible via Bayer network/VPN*" >> $GITHUB_STEP_SUMMARY

# =============================================================================
# Template Sync Workflow (For Child Repos)
# =============================================================================
# Checks for template updates and syncs platform files. Runs in CHILD repos,
# not the template repo itself.
#
# Triggers:
#   - Manual: "Actions" -> "Check Template Updates" -> "Run workflow"
#   - Scheduled: Weekly on Monday 9 AM UTC (PR mode - safe, reviewable)
#   - Called from other workflows via workflow_call
#
# What it does: hands off to the platform's reusable workflow
# (bayer-int/dd-platform-repository template-sync.yml), which
#   1. reads the template access token — the template repo is internal and a
#      project's GITHUB_TOKEN can never read it; the platform keeps the token
#      in AWS and this repo's own deploy role (vibe-<repo>-deploy) may read it
#      ONLY from that platform-owned workflow,
#   2. runs the shared update engine (scripts/apply-updates.sh --ci) in this
#      repo — the engine self-upgrades from the template ref, so even repos
#      with an old engine copy execute the current sync logic,
#   3. opens a PR with the changes (or commits directly if configured).
#
# Repos not yet onboarded to the platform (no deploy role) get a notice and a
# green run; update from a Codespace instead (see the run log).
# =============================================================================

name: Check Template Updates

on:
  workflow_dispatch:
    inputs:
      auto_merge:
        description: 'Auto-merge PR if no conflicts'
        required: false
        default: false
        type: boolean
      direct_commit:
        description: 'Commit directly to branch (skip PR)'
        required: false
        default: false
        type: boolean
      accept_major:
        description: 'Opt in to a MAJOR template release (new AI rules, snippets, harness). Everything replaced is backed up.'
        required: false
        default: false
        type: boolean
      template_ref:
        description: 'Platform team only: sync from this template branch instead of the release (canary)'
        required: false
        default: ''
        type: string

  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9 AM UTC (PR mode)

  workflow_call:
    inputs:
      auto_merge:
        type: boolean
        default: false
      direct_commit:
        type: boolean
        default: false
      accept_major:
        type: boolean
        default: false
    outputs:
      updated:
        description: 'Whether an update was applied'
        value: ${{ jobs.sync.outputs.updated }}
      new_version:
        description: 'The new template version'
        value: ${{ jobs.sync.outputs.new_version }}

permissions:
  id-token: write        # assume this repo's platform deploy role (token read)
  contents: write        # push the sync branch / direct commit
  pull-requests: write   # open the PR

env:
  TEMPLATE_REPO: bayer-int/dd-template-repository

jobs:
  check-repo:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          # Skip if this IS the template repo
          if [ "${{ github.repository }}" = "${{ env.TEMPLATE_REPO }}" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping - this IS the template repo"
            exit 0
          fi

          # This workflow should never run on push
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping - manual/scheduled/workflow_call only"
            exit 0
          fi

          echo "should_run=true" >> $GITHUB_OUTPUT

  sync:
    name: Sync Template Files
    needs: check-repo
    if: needs.check-repo.outputs.should_run == 'true'
    uses: bayer-int/dd-platform-repository/.github/workflows/template-sync.yml@master
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    with:
      project-name: ${{ github.event.repository.name }}
      direct_commit: ${{ inputs.direct_commit == true }}
      auto_merge: ${{ inputs.auto_merge == true }}
      accept_major: ${{ inputs.accept_major == true }}
      template_ref: ${{ inputs.template_ref || '' }}
    secrets:
      # Optional override: an org/repo secret with Contents: read on the
      # template repo. Empty when not provisioned — the platform token is used.
      TEMPLATE_READ_TOKEN: ${{ secrets.TEMPLATE_READ_TOKEN }}

  summary:
    name: Summary
    needs: [check-repo, sync]
    runs-on: ubuntu-latest
    if: always() && needs.check-repo.outputs.should_run == 'true'

    steps:
      - name: Summary
        env:
          UPDATED: ${{ needs.sync.outputs.updated }}
          NEW_VERSION: ${{ needs.sync.outputs.new_version }}
          HELD_WORKFLOWS: ${{ needs.sync.outputs.held_workflows }}
          PR_URL: ${{ needs.sync.outputs.pr_url }}
          SYNC_RESULT: ${{ needs.sync.result }}
        run: |
          # The platform job writes the detailed summary (PR link, held files,
          # major-release notice); this is the one-line verdict.
          echo "## 📊 Template Sync Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$SYNC_RESULT" != "success" ]; then
            echo "❌ **Sync did not complete** (job result: $SYNC_RESULT) — see the *Sync Template Files* log for the cause." >> $GITHUB_STEP_SUMMARY
          elif [ "$UPDATED" = "true" ]; then
            echo "📝 **Sync PR opened for v$NEW_VERSION:** ${PR_URL:-see the job summary} — review and merge." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Nothing to apply** — already up to date, or skipped (see the job summary)." >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$HELD_WORKFLOWS" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✋ Workflow files were held back (GitHub restriction) — run \`bash scripts/apply-updates.sh\` in a Codespace and commit." >> $GITHUB_STEP_SUMMARY
          fi
# =============================================================================
# Template Sync Workflow (For Child Repos)
# =============================================================================
# Checks for template updates and syncs platform files. Runs in CHILD repos,
# not the template repo itself.
#
# Triggers:
#   - Manual: "Actions" -> "Check Template Updates" -> "Run workflow"
#   - Scheduled: Weekly on Monday 9 AM UTC (PR mode - safe, reviewable)
#   - Called from other workflows via workflow_call
#
# What it does:
#   1. Fetches the template repo as a git remote
#   2. Runs the shared update engine (scripts/apply-updates.sh --ci).
#      The engine self-upgrades from the template ref, so even repos with an
#      old engine copy execute the current sync logic.
#   3. Opens a PR with the changes (or commits directly if configured)
#
# Auth: fetching the template uses TEMPLATE_READ_TOKEN if the org provides it
# (org-level secret with read access to the template repo), otherwise falls
# back to the workflow's GITHUB_TOKEN.
# =============================================================================

name: Check Template Updates

on:
  workflow_dispatch:
    inputs:
      auto_merge:
        description: 'Auto-merge PR if no conflicts'
        required: false
        default: false
        type: boolean
      direct_commit:
        description: 'Commit directly to branch (skip PR)'
        required: false
        default: false
        type: boolean

  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9 AM UTC (PR mode)

  workflow_call:
    inputs:
      auto_merge:
        type: boolean
        default: false
      direct_commit:
        type: boolean
        default: false
    outputs:
      updated:
        description: 'Whether an update was applied'
        value: ${{ jobs.sync.outputs.updated }}
      new_version:
        description: 'The new template version'
        value: ${{ jobs.sync.outputs.new_version }}

permissions:
  contents: write
  pull-requests: write

env:
  TEMPLATE_REPO: bayer-int/dd-template-repository
  TEMPLATE_BRANCH: master

jobs:
  check-repo:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          # Skip if this IS the template repo
          if [ "${{ github.repository }}" = "${{ env.TEMPLATE_REPO }}" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping - this IS the template repo"
            exit 0
          fi

          # This workflow should never run on push
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping - manual/scheduled/workflow_call only"
            exit 0
          fi

          echo "should_run=true" >> $GITHUB_OUTPUT

  sync:
    name: Sync Template Files
    needs: check-repo
    if: needs.check-repo.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.result.outputs.updated }}
      new_version: ${{ steps.run-engine.outputs.new_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run update engine
        id: run-engine
        run: |
          # Embed auth in the template URL so the engine's git fetch works.
          # TEMPLATE_READ_TOKEN (org secret) if present, else GITHUB_TOKEN.
          TOKEN="${{ secrets.TEMPLATE_READ_TOKEN || secrets.GITHUB_TOKEN }}"
          export TEMPLATE_URL="https://x-access-token:${TOKEN}@github.com/${{ env.TEMPLATE_REPO }}.git"
          export TEMPLATE_BRANCH="${{ env.TEMPLATE_BRANCH }}"

          set +e
          OUTPUT=$(bash scripts/apply-updates.sh --ci 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q "^UP_TO_DATE|"; then
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "✅ Already up to date"
            exit 0
          fi

          if [ $STATUS -ne 0 ] || ! echo "$OUTPUT" | grep -q "^UPDATE_COMPLETE|"; then
            echo "❌ Engine failed"
            exit 1
          fi

          NEW_VERSION=$(echo "$OUTPUT" | grep "^UPDATE_COMPLETE|" | cut -d'|' -f2)
          echo "needs_update=true" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Backed-up user-modified files -> surfaced in the PR body
          echo "$OUTPUT" | sed -n '/^Backed up /,/^$/p' > /tmp/backup-summary.txt || true

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected:"
            git status --short
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ No file changes needed"
          fi

      - name: Commit directly (if configured)
        if: steps.changes.outputs.has_changes == 'true' && inputs.direct_commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: sync platform files from template v${{ steps.run-engine.outputs.new_version }}"
          git push

          echo "✅ Changes committed directly"

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && inputs.direct_commit != 'true'
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TEMPLATE="${{ steps.run-engine.outputs.new_version }}"
          BRANCH="template-sync/v$TEMPLATE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Changelog entry for the new version (best effort, for the PR body)
          CHANGELOG=$(git show "template/${{ env.TEMPLATE_BRANCH }}:.template-manifest.yml" 2>/dev/null | awk -v ver="$TEMPLATE" '
            /^changelog:/ { in_cl=1; next }
            in_cl && $0 ~ "^  \"" ver "\":" { in_ver=1; next }
            in_cl && /^  "/ { in_ver=0 }
            in_ver && /^      - / { sub(/^      - /, "- "); gsub(/"/, ""); print }
          ' || echo "")

          BACKUPS=""
          if [ -s /tmp/backup-summary.txt ]; then
            BACKUPS=$(printf '### ⚠️ User-modified platform files\n\nThese files differed from the shipped version and were backed up to `.template-backup/` (gitignored) before being overwritten:\n\n```\n%s\n```\n' "$(cat /tmp/backup-summary.txt)")
          fi

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "📝 Updating existing PR #$EXISTING_PR..."
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH"
            git add -A
            git commit -m "chore: update platform files to v$TEMPLATE" --allow-empty
            git push --force origin "$BRANCH"
            echo "pr_number=$EXISTING_PR" >> $GITHUB_OUTPUT
          else
            echo "📝 Creating new PR..."
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "chore: sync platform files from template v$TEMPLATE"
            git push -u origin "$BRANCH"

            PR_URL=$(gh pr create \
              --title "⬆️ Platform Update: v$TEMPLATE" \
              --body "## 📦 Template Update

          **New version:** \`$TEMPLATE\`

          ### What changed

          ${CHANGELOG:-See the template changelog in \`.template-manifest.yml\`.}

          ${BACKUPS}

          ### Your Code is Safe ✅

          These are **never modified**:
          - \`frontend/src/\`, \`frontend/index.html\`
          - \`backend/server.js\`, \`backend/main.py\`, \`backend/src/\`
          - \`database/init/\`
          - Your Dockerfiles (\`frontend/Dockerfile\`, \`backend/Dockerfile\`)

          ---
          🤖 Auto-generated by Template Sync" \
              --head "$BRANCH")

            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "✅ Created PR: $PR_URL"
          fi

      - name: Auto-merge PR
        if: steps.create-pr.outputs.pr_number && inputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pr_number }} --auto --squash || echo "⚠️ Auto-merge not available"

      - name: Set outputs
        id: result
        run: |
          if [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

  summary:
    name: Summary
    needs: [check-repo, sync]
    runs-on: ubuntu-latest
    if: always() && needs.check-repo.outputs.should_run == 'true'

    steps:
      - name: Summary
        run: |
          echo "## 📊 Template Sync Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.sync.outputs.updated }}" = "true" ]; then
            echo "✅ **Update applied!** New version: v${{ needs.sync.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Already up to date**" >> $GITHUB_STEP_SUMMARY
          fi

# scopes: [backend]
# flags: []
# description: mypy strict-mode config for FastAPI / Python backends. Pair with Pydantic models for full compile-time type safety.

# Place at backend/mypy.ini. Run: `mypy backend/` (or `mypy --strict .` from within backend/).
# The strict flag enables a battery of useful checks; the per-flag overrides here
# are explicit so the intent is reviewable.

[mypy]
strict = True
python_version = 3.11
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
disallow_any_unimported = False
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
# Pretty errors with file/line info.
show_error_codes = True
pretty = True

# Third-party libs without type stubs — silence missing-import errors for these.
# Add more as your imports grow.
[mypy-pdfplumber.*]
ignore_missing_imports = True

[mypy-mammoth.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

# scopes: [integration]
# flags: []
# description: Full-stack docker-compose (frontend + backend + PostgreSQL).

# Full-stack docker-compose: frontend + backend + PostgreSQL database
# Adapt service names and ports to match your project.
# CRITICAL: credential VALUES never appear in this file (it is tracked; the
# pre-commit security check blocks literal passwords). They live in the
# workspace-root .env — DATABASE_NAME / DATABASE_USER / DATABASE_PASSWORD,
# written by the harness, gitignored — and are only REFERENCED here. Both
# services read the same variables, so they cannot drift.

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "3001:3000"
    # .env sits next to docker-compose.yml (DATABASE_*, VECTORDB_*, MGA_*);
    # backend/.env carries the app secrets (API keys) and is optional.
    env_file:
      - .env
      - path: backend/.env
        required: false
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      # MGA assistant wiring (when the app uses mga-* snippets — one
      # passthrough per MGA_* key the harness wrote to .env):
      # - MGA_API_KEY=${MGA_API_KEY}
      # - MGA_BASE_URL=${MGA_BASE_URL}
      # - MGA_ASSISTANT_ID=${MGA_ASSISTANT_ID}
    depends_on:
      database:
        condition: service_healthy

  database:
    build: ./database
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/data

volumes:
  db-data:

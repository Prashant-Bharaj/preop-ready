# scopes: [integration]
# flags: []
# description: docker-compose for frontend-only apps (no backend/db).

# Frontend-only docker-compose (no backend, no database)
# nginx.local.conf should be identical to nginx.conf (no proxy_pass)

version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

# scopes: [frontend]
# flags: []
# description: Local-dev nginx config — complete server block with /api and /socket.io proxy_pass to backend.
#
# Mounted by docker compose at /etc/nginx/conf.d/default.conf, so this file
# MUST be a complete server block (no `events {}` / `http {}` wrappers —
# nginx provides those at /etc/nginx/nginx.conf). Use this for local
# docker-compose runs; production deployments behind Traefik use the
# nginx.conf (which omits the /api proxy because Traefik handles upstream
# routing).
#
# Listen on 8080 (matches Dockerfile.react EXPOSE).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Proxy /api/* to backend:3000 (strips the /api prefix — backend handlers
    # see /tasks, /tasks/:id, etc. without /api/).
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket upgrade path for Socket.IO (real-time flag).
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # SPA fallback — every other path serves index.html so React Router
    # can handle client-side routing on full-page loads.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

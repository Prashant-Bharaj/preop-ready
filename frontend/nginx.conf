# ============================================================================
# NGINX CONFIGURATION - PRODUCTION
# ============================================================================
# This file is copied to /etc/nginx/conf.d/default.conf
# ONLY server block - NO events{} or http{} blocks!
#
# PRODUCTION: Traefik handles /api/* routing, nginx only serves static files
# LOCAL DEV:  docker-compose mounts nginx.local.conf (with API proxy)
# ============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint (REQUIRED for deployment)
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Handle SPA routing (React, Vue, Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent caching of HTML files (critical for SPA deployments)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache static assets with hashed filenames (1 year)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

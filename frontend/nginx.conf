# ============================================================================
# NGINX CONFIGURATION (for frontend containers serving static files)
# ============================================================================
# Use this if your frontend is a static site served by nginx.
# Delete this file if not using nginx.
# ============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Handle SPA routing (React, Vue, Angular)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to backend
        # In production, Traefik handles this - but this works for local dev
        location /api/ {
            proxy_pass http://backend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

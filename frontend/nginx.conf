# ============================================================================
# NGINX CONFIGURATION (for frontend containers serving static files)
# ============================================================================
# IMPORTANT: This file is copied to /etc/nginx/conf.d/default.conf
# It must ONLY contain a server block - NO events{} or http{} blocks!
#
# This config works in BOTH environments:
# - Local (docker-compose): nginx proxies /api/* to backend container
# - Production (ECS): Traefik handles /api/* routing, nginx only serves static files
# ============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver for Docker (allows nginx to start even if backend doesn't exist)
    # 127.0.0.11 is Docker's internal DNS server
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream backend:3000;

    # Handle SPA routing (React, Vue, Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent caching of HTML files (critical for SPA deployments)
    # This ensures browsers always fetch the latest index.html which references
    # the correct hashed JS/CSS files after each deployment
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Proxy API requests to backend (for local docker-compose development)
    # In production (ECS), Traefik handles this routing - these requests won't reach nginx
    # Using variable ($backend_upstream) prevents nginx crash if backend hostname doesn't exist
    location /api/ {
        proxy_pass http://$backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Socket.IO/WebSocket requests to backend (for local docker-compose development)
    location /socket.io/ {
        proxy_pass http://$backend_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Health check endpoint (REQUIRED for deployment)
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Cache static assets with hashed filenames (1 year)
    # These files have content hashes in their names, so they're safe to cache long-term
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Local development only. Production ignores this file.
services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      - PORT=3000
      - ALLOW_LOCAL_DEV_IDENTITY=true
      - TZ=Europe/Berlin
      - PREOP_CONTEXT_DIR=/context
    volumes:
      - preop-data:/data
      - ./context:/context:ro
    env_file:
      - path: ./backend/.env
        required: false

volumes:
  preop-data:

# ============================================================================
# LOCAL DEVELOPMENT - DOCKER COMPOSE
# ============================================================================
# This file is configured by AI based on your stack choice.
#
# Commands:
#   docker compose up --build     # Start all services
#   docker compose down           # Stop services
#   docker compose logs -f        # View logs
#   docker compose up db -d       # Start only database
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # FRONTEND
  # --------------------------------------------------------------------------
  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    volumes:
      # Mount local nginx config with API proxy (production nginx.conf has no proxy)
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # BACKEND (REMOVE THIS ENTIRE BLOCK FOR FRONTEND-ONLY APPS)
  # Also remove "depends_on: backend" from frontend service above
  # --------------------------------------------------------------------------
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    # Credentials never live in this file — it is tracked in git and the
    # pre-commit security check blocks literal passwords. The gitignored root
    # .env (next to this file) holds DATABASE_NAME / DATABASE_USER /
    # DATABASE_PASSWORD; Compose reads it for the ${...} references below and
    # the backend loads it here. The AI assistant (or the harness) creates it —
    # see .platform-rules/scope-integration.md. backend/.env holds the app
    # secrets; `required: false` is load-bearing there: nothing creates it on a
    # fresh clone, and without the flag Compose hard-errors ("env file ... not
    # found") on the very first `docker compose up`. Needs Compose v2.24+
    # (Codespaces ships newer).
    env_file:
      - .env                          # DATABASE_* — gitignored
      - path: ./backend/.env          # App secrets — gitignored, optional
        required: false
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=3306           # Change to 5432 for PostgreSQL
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # DATABASE (REMOVE THIS ENTIRE BLOCK FOR FRONTEND-ONLY APPS)
  # --------------------------------------------------------------------------
  # AI will switch to PostgreSQL if needed (replace entire db block)
  db:
    image: mysql:8.0
    # Values come from the root .env (see the backend note) — references only.
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d  # Init scripts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # DATABASE (PostgreSQL - alternative)
  # --------------------------------------------------------------------------
  # AI will uncomment this and remove MySQL if PostgreSQL is chosen:
  # db:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_DB: ${DATABASE_NAME}
  #     POSTGRES_USER: ${DATABASE_USER}
  #     POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - db_data:/var/lib/postgresql/data
  #     - ./database/init:/docker-entrypoint-initdb.d  # Init scripts
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
